<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1030" viewBox="0 0 1500 1030">
<rect width="100%" height="100%" fill="#ffffff"/>
<style>
.title { font: 700 26px Arial, sans-serif; fill:#1f2937; }
.entity { font: 700 17px Arial, sans-serif; fill:#ffffff; }
.field { font: 14px Arial, sans-serif; fill:#1f2937; }
.rel { font: 12px Arial, sans-serif; fill:#475569; }
.box { fill:#f8fafc; stroke:#334155; stroke-width:2; rx:8; }
.head { fill:#334155; }
.line { stroke:#64748b; stroke-width:1.7; fill:none; }
</style>
<text x="750" y="28" text-anchor="middle" class="title">ER-диаграмма БД «Доска объявлений с геолокацией»</text>
<rect x="40" y="40" width="350" height="230" class="box"/>
<rect x="40" y="40" width="350" height="36" class="head" rx="8"/>
<rect x="40" y="68" width="350" height="8" class="head"/>
<text x="54" y="64" class="entity">USERS</text>
<text x="54" y="98" class="field">PK user_id BIGINT</text>
<text x="54" y="124" class="field">display_name VARCHAR(100)</text>
<text x="54" y="150" class="field">UK login VARCHAR(150)</text>
<text x="54" y="176" class="field">password_hash TEXT</text>
<text x="54" y="202" class="field">created_at TIMESTAMPTZ</text>
<text x="54" y="228" class="field">updated_at TIMESTAMPTZ</text>
<rect x="430" y="40" width="320" height="190" class="box"/>
<rect x="430" y="40" width="320" height="36" class="head" rx="8"/>
<rect x="430" y="68" width="320" height="8" class="head"/>
<text x="444" y="64" class="entity">CATEGORIES</text>
<text x="444" y="98" class="field">PK category_id BIGINT</text>
<text x="444" y="124" class="field">UK name VARCHAR(100)</text>
<text x="444" y="150" class="field">description TEXT</text>
<text x="444" y="176" class="field">created_at TIMESTAMPTZ</text>
<rect x="800" y="40" width="320" height="230" class="box"/>
<rect x="800" y="40" width="320" height="36" class="head" rx="8"/>
<rect x="800" y="68" width="320" height="8" class="head"/>
<text x="814" y="64" class="entity">CITIES</text>
<text x="814" y="98" class="field">PK city_id BIGINT</text>
<text x="814" y="124" class="field">name VARCHAR(150)</text>
<text x="814" y="150" class="field">region VARCHAR(150)</text>
<text x="814" y="176" class="field">country VARCHAR(100)</text>
<text x="814" y="202" class="field">latitude NUMERIC</text>
<text x="814" y="228" class="field">longitude NUMERIC</text>
<rect x="500" y="330" width="480" height="320" class="box"/>
<rect x="500" y="330" width="480" height="36" class="head" rx="8"/>
<rect x="500" y="358" width="480" height="8" class="head"/>
<text x="514" y="354" class="entity">ADS</text>
<text x="514" y="388" class="field">PK ad_id BIGINT</text>
<text x="514" y="414" class="field">FK author_id → USERS</text>
<text x="514" y="440" class="field">FK category_id → CATEGORIES</text>
<text x="514" y="466" class="field">FK city_id → CITIES</text>
<text x="514" y="492" class="field">title VARCHAR(200)</text>
<text x="514" y="518" class="field">description TEXT</text>
<text x="514" y="544" class="field">price NUMERIC(12,2)</text>
<text x="514" y="570" class="field">status VARCHAR(20)</text>
<text x="514" y="596" class="field">location GEOGRAPHY(POINT,4326)</text>
<text x="514" y="622" class="field">published_at TIMESTAMPTZ</text>
<text x="514" y="648" class="field">updated_at TIMESTAMPTZ</text>
<rect x="1050" y="350" width="390" height="190" class="box"/>
<rect x="1050" y="350" width="390" height="36" class="head" rx="8"/>
<rect x="1050" y="378" width="390" height="8" class="head"/>
<text x="1064" y="374" class="entity">AD_IMAGES</text>
<text x="1064" y="408" class="field">PK image_id BIGINT</text>
<text x="1064" y="434" class="field">FK ad_id → ADS</text>
<text x="1064" y="460" class="field">image_url TEXT</text>
<text x="1064" y="486" class="field">sort_order INTEGER</text>
<text x="1064" y="512" class="field">created_at TIMESTAMPTZ</text>
<rect x="40" y="390" width="350" height="180" class="box"/>
<rect x="40" y="390" width="350" height="36" class="head" rx="8"/>
<rect x="40" y="418" width="350" height="8" class="head"/>
<text x="54" y="414" class="entity">FAVORITES</text>
<text x="54" y="448" class="field">PK/FK user_id → USERS</text>
<text x="54" y="474" class="field">PK/FK ad_id → ADS</text>
<text x="54" y="500" class="field">added_at TIMESTAMPTZ</text>
<rect x="40" y="680" width="350" height="170" class="box"/>
<rect x="40" y="680" width="350" height="36" class="head" rx="8"/>
<rect x="40" y="708" width="350" height="8" class="head"/>
<text x="54" y="704" class="entity">DIALOGS</text>
<text x="54" y="738" class="field">PK dialog_id BIGINT</text>
<text x="54" y="764" class="field">FK ad_id → ADS</text>
<text x="54" y="790" class="field">created_at TIMESTAMPTZ</text>
<rect x="500" y="720" width="420" height="170" class="box"/>
<rect x="500" y="720" width="420" height="36" class="head" rx="8"/>
<rect x="500" y="748" width="420" height="8" class="head"/>
<text x="514" y="744" class="entity">DIALOG_PARTICIPANTS</text>
<text x="514" y="778" class="field">PK/FK dialog_id → DIALOGS</text>
<text x="514" y="804" class="field">PK/FK user_id → USERS</text>
<text x="514" y="830" class="field">joined_at TIMESTAMPTZ</text>
<rect x="1010" y="680" width="430" height="220" class="box"/>
<rect x="1010" y="680" width="430" height="36" class="head" rx="8"/>
<rect x="1010" y="708" width="430" height="8" class="head"/>
<text x="1024" y="704" class="entity">MESSAGES</text>
<text x="1024" y="738" class="field">PK message_id BIGINT</text>
<text x="1024" y="764" class="field">FK dialog_id → DIALOGS</text>
<text x="1024" y="790" class="field">FK sender_id → USERS</text>
<text x="1024" y="816" class="field">message_text TEXT</text>
<text x="1024" y="842" class="field">sent_at TIMESTAMPTZ</text>
<path d="M390,155.0 C445.0,155.0 445.0,490.0 500,490.0" class="line"/>
<text x="445.0" y="317.5" text-anchor="middle" class="rel">1 : N</text>
