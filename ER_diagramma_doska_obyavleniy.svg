<text x="1015.0" y="462.5" text-anchor="middle" class="rel">1 : N</text>
<path d="M390,150 C390.0,150 390.0,450 390,450" class="line"/>
<text x="390.0" y="295.0" text-anchor="middle" class="rel">1 : N</text>
<path d="M500,520 C445.0,520 445.0,520 390,520" class="line"/>
<text x="445.0" y="515.0" text-anchor="middle" class="rel">1 : N</text>
<path d="M500,600 C445.0,600 445.0,750 390,750" class="line"/>
<text x="445.0" y="670.0" text-anchor="middle" class="rel">1 : N</text>
<path d="M390,765.0 C445.0,765.0 445.0,805.0 500,805.0" class="line"/>
<text x="445.0" y="780.0" text-anchor="middle" class="rel">1 : N</text>
<path d="M250,270 C435.0,270 435.0,720 620,720" class="line"/>
<text x="435.0" y="490.0" text-anchor="middle" class="rel">1 : N</text>
<path d="M390,760 C700.0,760 700.0,760 1010,760" class="line"/>
<text x="700.0" y="755.0" text-anchor="middle" class="rel">1 : N</text>
<path d="M250,270 C630.0,270 630.0,840 1010,840" class="line"/>
<text x="630.0" y="550.0" text-anchor="middle" class="rel">1 : N</text>
<text x="40" y="980" class="rel">PK — первичный ключ; FK — внешний ключ; UK — уникальное ограничение.</text>
</svg>